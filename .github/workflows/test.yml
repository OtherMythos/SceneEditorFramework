name: Test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      pull-requests: write
    strategy:
      matrix:
        buildType: [Debug, Release]

    steps:
      - name: Set up OpenGL and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-utils xvfb fuse libfuse2
      - name: Check out the plugin
        uses: actions/checkout@v6
      - name: Check out avTools
        uses: actions/checkout@v6
        with:
          path: avTools
          repository: OtherMythos/avTools
      - name: Download the avEngine AppImage
        uses: dawidd6/action-download-artifact@v8
        with:
          name: av-x86_64-${{ matrix.buildType }}.AppImage
          repo: OtherMythos/avEngine
          workflow: buildLinux.yml
      # The stress plan runs the example editor, which needs the imgui plugin the
      # example bundles. That distribution is not kept in this repository, so it
      # is fetched here. Its artifact carries the plugin's version and commit in
      # its name, hence the pattern rather than a fixed one.
      - name: Download the avImguiPlugin distribution
        uses: dawidd6/action-download-artifact@v8
        with:
          name: avImguiPlugin-
          name_is_regexp: true
          repo: OtherMythos/avEngineIMGUI
          workflow: build.yml
          path: /tmp/imguiPlugin
      - name: Install the imgui plugin where the example expects it
        run: |
          mkdir -p example/plugins
          mv /tmp/imguiPlugin/*/avImguiPlugin example/plugins/avImguiPlugin
          ls example/plugins/avImguiPlugin
      - name: Run tests
        run: |
          chmod +x ./av-x86_64.AppImage
          mkdir /tmp/testLogs
          xvfb-run python3 avTools/testRunner/testRunner.py \
            -l /tmp/testLogs \
            -e ./av-x86_64.AppImage \
            -p test/avTests.cfg \
            -o "$GITHUB_WORKSPACE/results-${{ matrix.buildType }}.xml"
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: results-${{ matrix.buildType }}.xml
      - name: Upload test logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sceneEditorFrameworkTestLogs-${{ matrix.buildType }}
          path: /tmp/testLogs
